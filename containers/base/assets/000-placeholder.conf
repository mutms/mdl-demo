# Served on 8082 until a demo site is installed; mdl-demo swaps this for
# the real Moodle vhost at install time and restores it on reset.
<VirtualHost *:8082>
    DocumentRoot /var/www/placeholder
    <Directory /var/www/placeholder>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>
</VirtualHost>
