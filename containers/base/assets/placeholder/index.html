<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdl-demo</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0 auto; padding: 4rem 1.5rem; max-width: 40rem; }
  h1 { font-size: 1.35rem; letter-spacing: -.01em; }
  p { color: #6b7280; }
  code { font-family: ui-monospace, SFMono-Regular, monospace; }
</style>
<h1>mdl-demo</h1>
<p>No demo site is installed yet.</p>
<p>Install one from the management console — it is on the port one below
   this page's: <a id="console" href="/">the console</a>.</p>
<script>
  // The console is always on site port − 1 (no port at all means a proxy
  // sits in front and only the operator knows where the console lives).
  var a = document.getElementById('console'), p = Number(location.port);
  if (p > 1) {
    a.href = location.protocol + '//' + location.hostname + ':' + (p - 1);
    a.textContent = a.href;
  } else {
    a.removeAttribute('href');
  }
</script>
</html>
