{{/* The header's right-side controls, on every page: the language switcher
     (cookie via GET /lang) and the theme toggle cycling auto → light → dark
     (localStorage, handler in head.html). */}}
{{define "topctl"}}<div class="row topctl">
  <nav class="langs">
    <a href="/lang?set=en&to={{.Path}}"{{if eq .Lang "en"}} class="cur"{{end}}>EN</a><a href="/lang?set=cs&to={{.Path}}"{{if eq .Lang "cs"}} class="cur"{{end}}>CS</a><a href="/lang?set=de&to={{.Path}}"{{if eq .Lang "de"}} class="cur"{{end}}>DE</a>
  </nav>
  <a id="settingsbtn" href="/settings" title="{{t .Lang "Settings"}}" aria-label="{{t .Lang "Settings"}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
  <button id="themebtn" type="button" title="{{t .Lang "Theme"}}">◐</button>
</div>{{end}}
