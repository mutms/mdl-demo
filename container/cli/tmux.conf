# The CLI console's tmux. Selecting text must stay the browser terminal's job, so
# tmux leaves the mouse alone. For the same reason it stays out of the alternate
# screen: lines it scrolls off then reach the terminal's own scrollback, and the
# wheel works.
set -g mouse off
set -as terminal-overrides ",xterm*:smcup@:rmcup@"
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -g escape-time 10
set -g window-size latest
# Copying in tmux, and Claude Code's "copy the login URL", reach the browser
# clipboard through OSC 52.
set -g set-clipboard on
set -as terminal-features ",xterm-256color:RGB:clipboard"
set -g status-right ""
set -g status-left "[#S] "
set -g status-style "bg=#2b2b2b,fg=#cacaca"
